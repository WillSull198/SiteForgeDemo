# Tells Railway exactly how to build and serve SiteForge.
# Without this, Nixpacks guesses, and Vite SPAs can get the wrong start command.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm ci || npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
