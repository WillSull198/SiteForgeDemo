<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteForge Railway Debug</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafaf7;
        color: #0b0e13;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        background: white;
        border: 1px solid #e4e2db;
        border-radius: 14px;
        padding: 28px;
      }
      code, pre {
        background: #f1efe8;
        border-radius: 6px;
      }
      code {
        padding: 2px 6px;
      }
      pre {
        padding: 14px;
        white-space: pre-wrap;
      }
      button {
        background: #d97706;
        border: 0;
        border-radius: 7px;
        color: white;
        cursor: pointer;
        font-weight: 700;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SiteForge Railway Debug</h1>
      <p>If this page loads, Railway is serving static files. If the main app is blank, the issue is in the app bundle, cached service worker, or browser runtime.</p>
      <p><button id="reset">Reset offline cache</button></p>
      <pre id="status">Collecting diagnostics...</pre>
    </main>
    <script>
      async function collect() {
        var registrations = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistrations() : [];
        var cacheNames = "caches" in window ? await caches.keys() : [];
        document.getElementById("status").textContent = JSON.stringify({
          href: location.href,
          userAgent: navigator.userAgent,
          serviceWorkers: registrations.map(function (registration) {
            return registration.scope;
          }),
          caches: cacheNames,
          timestamp: new Date().toISOString(),
        }, null, 2);
      }

      document.getElementById("reset").addEventListener("click", async function () {
        if ("serviceWorker" in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          for (var index = 0; index < registrations.length; index += 1) {
            await registrations[index].unregister();
          }
        }
        if ("caches" in window) {
          var keys = await caches.keys();
          for (var cacheIndex = 0; cacheIndex < keys.length; cacheIndex += 1) {
            await caches.delete(keys[cacheIndex]);
          }
        }
        alert("Offline cache cleared. Reload the main SiteForge URL.");
        collect();
      });

      collect().catch(function (error) {
        document.getElementById("status").textContent = error && error.message ? error.message : String(error);
      });
    </script>
  </body>
</html>
